 
<div class="app-shell">
  <header class="app-header">
    <div class="app-header__brand">
      <div class="app-header__logo">⚖</div>
      <div>
        <span class="app-header__eyebrow">Quantity Measurement</span>
        <span class="app-header__title">Measurement Dashboard</span>
      </div>
    </div>

    <nav class="app-header__nav">
      <p class="app-header__message" *ngIf="!auth.isLoggedIn">
        Convert, compare, and track units.
      </p>

      <ng-container *ngIf="auth.isLoggedIn">
        <div class="app-header__user">
          <span class="app-header__status"></span>
          <div>
            <small>Signed in as</small>
            <strong>{{ auth.email }}</strong>
          </div>
        </div>
        <button class="btn btn--ghost" (click)="logout()">Logout</button>
      </ng-container>
    </nav>
  </header>

  <main class="app-main">
    <router-outlet></router-outlet>
  </main>

  <footer class="app-footer">
    <p>Quantity Measurement &copy; 2026</p>
  </footer>
</div>
