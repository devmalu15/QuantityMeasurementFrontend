<div class="landing animate-fade">
  <section class="card welcome-card">
    <div class="card-head">
      <h1>Welcome to Quantity Measurement</h1>
      <p>Choose how you want to use the app:</p>
    </div>

    <div class="landing-actions">
      <button class="btn btn--primary" (click)="goLogin()">Login</button>
      <button class="btn btn--secondary" (click)="goRegister()">Register</button>
      <button class="btn btn--ghost" (click)="continueGuest()">Continue as Guest</button>
    </div>

    <p class="hint">Guest mode allows operations only. Database history is reserved for authenticated users.</p>
  </section>
</div>
